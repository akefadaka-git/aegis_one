name: Android foundation CI
on:
  push:
    branches: ["docs/a1-baseline-a2-reconciliation"]
    paths:
      - ".github/workflows/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew*"
      - "gradle.properties"
      - "app/**"
      - "core/**"
      - "platform/**"
  pull_request:
    branches: ["docs/a1-baseline-a2-reconciliation"]
    paths:
      - ".github/workflows/**"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew*"
      - "gradle.properties"
      - "app/**"
      - "core/**"
      - "platform/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aegis-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test and Android lint
        run: ./gradlew --no-daemon clean test lint assembleDebug
