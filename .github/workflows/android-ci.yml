name: Android foundation CI
on:
  push:
    branches: ["docs/a1-baseline-a2-reconciliation"]
    paths:
      - ".github/workflows/**"
      - ".gitleaks.toml"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew*"
      - "gradle.properties"
      - "app/**"
      - "core/**"
      - "platform/**"
  pull_request:
    branches: ["docs/a1-baseline-a2-reconciliation"]
    paths:
      - ".github/workflows/**"
      - ".gitleaks.toml"
      - "*.gradle.kts"
      - "gradle/**"
      - "gradlew*"
      - "gradle.properties"
      - "app/**"
      - "core/**"
      - "platform/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aegis-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Scan full Git history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 2 --report-format sarif --report-path gitleaks.sarif --log-opts="--all"
      - name: Build, test, lint, assemble and generate SBOM
        run: ./gradlew --no-daemon clean test lint assembleDebug cyclonedxBom
      - name: Preserve CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-one-ci-evidence-${{ github.sha }}
          path: |
            build/reports/cyclonedx/bom.json
            app/build/outputs/apk/debug/app-debug.apk
            gitleaks.sarif
          if-no-files-found: warn
