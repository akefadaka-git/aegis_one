name: Android foundation CI
on:
  push:
    branches: ["docs/a1-baseline-a2-reconciliation"]
  pull_request:
    branches: ["docs/a1-baseline-a2-reconciliation"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aegis-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build and test
        run: gradle --no-daemon clean test assembleDebug
